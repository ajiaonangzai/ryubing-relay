name: relay
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe canonical endpoints (diagnostic)
        run: |
          set +e
          : > diag.txt
          for api in \
            "https://git.ryujinx.app/api/v1/repos/Ryubing/ryujinx/releases/latest" \
            "https://git.ryujinx.app/projects/Ryubing/releases/download/1.3.3/ryujinx-1.3.3-win_x64.zip"; do
            echo "==== $api" >> diag.txt
            curl -sSL --max-time 40 -w "\nHTTP=%{http_code} TIME=%{time_total}\n" "$api" -o dl.bin >> diag.txt 2>&1
            echo "bytes=$(stat -c%s dl.bin 2>/dev/null || wc -c < dl.bin)" >> diag.txt
            file dl.bin >> diag.txt 2>&1
            head -c 300 dl.bin >> diag.txt 2>&1; echo >> diag.txt
            rm -f dl.bin
          done
          echo "== DNS getent ==" >> diag.txt
          getent hosts git.ryujinx.app >> diag.txt 2>&1
          echo "== DNS nslookup ==" >> diag.txt
          nslookup git.ryujinx.app >> diag.txt 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.email "relay@users.noreply.github.com"
          git config user.name "relay"
          git add diag.txt
          git commit -m "diag $(date +%s)" || true
          git push origin HEAD:main || echo "push failed"
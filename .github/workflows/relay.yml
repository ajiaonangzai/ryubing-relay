name: relay
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and download latest Ryubing win_x64 from canonical
        run: |
          set -e
          DL=""
          for api in \
            "https://git.ryujinx.app/api/v1/repos/Ryubing/ryujinx/releases/latest" \
            "https://git.ryujinx.app/api/v1/repos/ryubing/ryujinx/releases/latest"; do
            echo "== API: $api"
            if curl -fsSL --max-time 30 "$api" -o rel.json 2>/dev/null; then
              url=$(jq -r '.assets[]?.browser_download_url // empty' rel.json | grep -iE 'win_x64.*\.zip$' | head -n1)
              if [ -n "$url" ]; then echo "api_url=$url"; DL=$url; break; fi
            fi
          done
          if [ -z "$DL" ]; then
            DL="https://git.ryujinx.app/projects/Ryubing/releases/download/1.3.3/ryujinx-1.3.3-win_x64.zip"
            echo "fallback_url=$DL"
          fi
          echo "DL=$DL"
          curl -fsSL --max-time 180 -o ryujinx.zip "$DL"
          ls -la ryujinx.zip
          echo "source_url=$DL" > meta.txt
          sha256sum ryujinx.zip | tee -a meta.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat meta.txt)
          tag="relay-$(date +%s)"
          gh release create "$tag" ryujinx.zip --repo "${{ github.repository }}" --title "ryubing-win-x64" --notes "$notes"